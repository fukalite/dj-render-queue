site_name: dj-render-queue
site_url: https://fukalite.github.io/dj-render-queue/
repo_url: https://github.com/fukalite/dj-render-queue
repo_name: fukalite/dj-render-queue
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

hooks:
  - docs_hooks/changelog.py

plugins:
  - search

markdown_extensions:
  - attr_list

nav:
  - Home: index.md
  - Changelog: changelog.md
